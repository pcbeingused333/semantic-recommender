version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: semantic-recommender-db
    restart: always
    environment:
      POSTGRES_DB: recommender
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"          # ← Changed to 5433 on your computer
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: semantic-recommender-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/recommender
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    depends_on:
      - db
    volumes:
      - ./backend:/app
    working_dir: /app

volumes:
  postgres_data: